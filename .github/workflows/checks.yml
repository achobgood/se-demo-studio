name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"   # Mondays: gitleaks scans the full history on scheduled runs

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Repo checks
        run: scripts/check-repo.sh
      - name: Secret scan of the full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
