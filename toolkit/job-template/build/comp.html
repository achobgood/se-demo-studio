<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Demo composition</title>
<link href="fonts/fonts.css" rel="stylesheet" />
<style>
  :root {
    --bg0: #060a13; --bg1: #0c1424; --panel: #111b2f; --panel2: #16223a; --line: rgba(160, 190, 255, .10);
    --text: #eef3ff; --muted: #8e9cb8; --dim: #5b6784;
    --blue: #3b82f6; --blue2: #1d6ae5; --cyan: #4fd6f0; --alert: #ff5b4f; --amber: #ffb547; --ok: #3ecf8e;
    --sans: "Inter", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--sans); color: var(--text);
    background: radial-gradient(120% 100% at 50% 40%, var(--bg1) 0%, var(--bg0) 70%); }
  .layer { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
  .grid { position: absolute; inset: -200px; background-image:
      linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 80px 80px; opacity: .55;
    mask-image: radial-gradient(70% 65% at 50% 50%, #000 30%, transparent 100%); -webkit-mask-image: radial-gradient(70% 65% at 50% 50%, #000 30%, transparent 100%); }
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .abs { position: absolute; }

  /* Hook console tiles (abstract, no real product UI) */
  .tile { position: absolute; width: 400px; height: 250px; border-radius: 16px; background: linear-gradient(180deg, #152037, #0f182b);
    border: 1px solid rgba(160,190,255,.14); box-shadow: 0 30px 70px rgba(0,0,0,.55); overflow: hidden; }
  .tile .hd { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid rgba(160,190,255,.10);
    font: 600 17px var(--sans); color: #dfe7fb; letter-spacing: -.01em; }
  .tile .hd i { width: 9px; height: 9px; border-radius: 50%; background: #2a3a5c; display: block; }
  .tile .hd .lk { margin-left: auto; font: 500 12px var(--mono); color: var(--muted); letter-spacing: .08em; }
  .tile .bd { position: absolute; left: 16px; right: 16px; top: 60px; bottom: 16px; }
  .sk { position: absolute; height: 9px; border-radius: 5px; background: rgba(160,190,255,.13); }
  .frag { position: absolute; border-radius: 8px; border: 2px solid var(--amber); background: rgba(255,181,71,.12);
    box-shadow: 0 0 24px rgba(255,181,71,.35); }
  .signin { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 10px 18px; border-radius: 10px;
    background: rgba(8,12,22,.92); border: 1px solid rgba(160,190,255,.25); font: 500 15px var(--mono); color: #cfd9f2; letter-spacing: .06em; white-space: nowrap; }
  .token { position: absolute; padding: 9px 14px; border-radius: 8px; background: #0b1222; border: 1.5px dashed var(--cyan);
    font: 500 19px var(--mono); color: var(--cyan); white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .chip { position: absolute; display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px;
    background: rgba(17,27,47,.92); border: 1px solid rgba(160,190,255,.22); font: 600 21px var(--sans); color: var(--text); white-space: nowrap; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--alert); box-shadow: 0 0 14px var(--alert); }
  .mono { font-family: var(--mono); }

  /* Browser frame around real product captures */
  .frame { position: absolute; left: 0; top: 0; width: 1600px; border-radius: 14px; overflow: hidden; background: #f3f5f9;
    box-shadow: 0 50px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(160,190,255,.18); transform-origin: 50% 50%; }
  .frame .bar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #1a2336; }
  .frame .bar i { width: 11px; height: 11px; border-radius: 50%; background: #34405a; display: block; }
  .frame .url { margin-left: 18px; flex: 1; max-width: 640px; height: 26px; border-radius: 13px; background: #0f1628;
    display: flex; align-items: center; padding: 0 14px; font: 500 14px var(--mono); color: #93a3c4; }
  .frame .url b { color: #dbe5fb; font-weight: 500; }
  .frame .vp { position: relative; overflow: hidden; background: #f3f5f9; }
  .frame .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .frame .cam img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; }
  .cursor { position: absolute; width: 28px; height: 28px; left: 0; top: 0; pointer-events: none; opacity: 0; }
  .ring { position: absolute; border: 3px solid var(--blue); border-radius: 12px; opacity: 0;
    box-shadow: 0 0 0 7px rgba(59,130,246,.18), 0 0 36px rgba(59,130,246,.35); }
  .ring.amber { border-color: var(--amber); box-shadow: 0 0 0 7px rgba(255,181,71,.2), 0 0 36px rgba(255,181,71,.35); }
  .tag { position: absolute; opacity: 0; white-space: nowrap; background: #0b1222; color: #fff;
    font: 600 22px var(--sans); letter-spacing: -.005em; padding: 12px 20px; border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0,0,0,.35); border: 1px solid rgba(160,190,255,.18); }
  .tag small { display: block; font: 500 14px var(--mono); color: var(--cyan); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
  .demo-tag { position: absolute; left: 40px; bottom: 30px; font: 500 18px var(--mono); color: #b4c0d8; letter-spacing: .08em; opacity: 0; }

  /* Type */
  .h1 { font-weight: 650; letter-spacing: -.035em; line-height: 1; color: var(--text); }
  .kicker { font: 500 20px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); }
  .fine { font: 400 15px var(--sans); color: #8e9cb8; line-height: 1.5; }
  svg.over { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

  /* SE demo additions */
  #stage { background: #0d1320; }
  .stagebg { position:absolute; inset:0; background: radial-gradient(90% 80% at 30% 20%, #16223a 0%, #0d1320 60%, #0a0f1a 100%); }
  .card { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .t-kick { font: 500 22px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:#7fb4ff; }
  .t-h { font-weight:650; letter-spacing:-.035em; line-height:1.02; color:#f2f6ff; }
  .t-sub { font: 400 34px var(--sans); color:#aebbd4; letter-spacing:-.01em; line-height:1.35; }
  .disc { font: 400 22px var(--sans); color:#9fb0cc; line-height:1.55; }
  .disc b { color:#dfe8fa; font-weight:600; }
  .rule { height:2px; background: linear-gradient(90deg, #3b82f6, rgba(59,130,246,0)); }
  .ag-row { position:absolute; display:flex; align-items:baseline; gap:28px; font: 500 40px var(--sans); color:#dbe4f6; letter-spacing:-.015em; }
  .ag-row .n { font: 500 24px var(--mono); color:#7fb4ff; width:48px; }
  .ag-row.dim { color:#5f6d8a; }
  .chipbar { position:absolute; left:110px; top:12px; display:flex; gap:10px; align-items:center; }
  .cchip { font: 500 15px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:#8f9cb6; padding:6px 12px; border-radius:999px; border:1px solid rgba(160,190,255,.14); background:rgba(17,27,47,.6); white-space:nowrap; }
  .cchip.on { color:#e8f0ff; border-color:rgba(96,165,250,.7); background:rgba(37,99,235,.28); }
  .foot { position:absolute; right:110px; bottom:10px; font: 500 15px var(--mono); letter-spacing:.06em; color:#8190ad; white-space:nowrap; }
  .lower { position:absolute; left:110px; bottom:64px; padding:14px 22px; border-radius:12px; background:rgba(10,15,26,.88); border:1px solid rgba(160,190,255,.2); font:500 20px var(--sans); color:#dfe8fa; box-shadow:0 18px 40px rgba(0,0,0,.4); }
  .ramp { position:absolute; right:130px; top:74px; padding:8px 14px; border-radius:999px; background:rgba(10,15,26,.82); border:1px solid rgba(160,190,255,.22); font:500 16px var(--mono); letter-spacing:.06em; color:#cfe0ff; }
  .rc-item { position:absolute; left:250px; width:1420px; display:flex; gap:30px; align-items:flex-start; }
  .rc-item .ic { width:14px; height:14px; margin-top:14px; border-radius:4px; background:#3b82f6; flex:none; }
  .rc-item .tx { font: 500 38px var(--sans); color:#e6edfb; letter-spacing:-.015em; line-height:1.3; }
  .rc-item .tx small { display:block; font: 400 24px var(--sans); color:#98a8c6; margin-top:6px; letter-spacing:0; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="cues.js"></script>
<script src="footage.js"></script>
<script src="engine.js"></script>
<script src="story.js"></script>
<script src="scenes.js"></script>
</body>
</html>
